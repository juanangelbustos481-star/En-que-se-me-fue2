<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>¿En qué se me fue?</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #818cf8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      transition: background 0.2s, color 0.2s;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin: 2px 0 0; }
    .actions { display: flex; gap: 8px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (min-width: 600px) {
      .grid-stats { grid-template-columns: repeat(4, 1fr); }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
    .stat-val { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .cat-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 4px;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .cat-btn.active {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      color: var(--primary);
    }
    .chart-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .chart-wrap { flex-direction: row; justify-content: space-around; }
    }
    .legend { width: 100%; max-width: 300px; }
    .legend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 4px 0;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .expense-item:last-child { border-bottom: none; }
    .exp-info { display: flex; flex-direction: column; }
    .exp-title { font-weight: 600; font-size: 0.95rem; }
    .exp-meta { font-size: 0.75rem; color: var(--muted); }
    .exp-right { display: flex; align-items: center; gap: 10px; }
    .exp-amount { font-weight: 700; }
    .btn-del {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 0.85rem;
    }
    #installBanner {
      display: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="installBanner">
      <span>📲 Instalar app en tu dispositivo</span>
      <button id="installBtn" style="background:#fff; color:#4f46e5;">Instalar</button>
    </div>

    <header>
      <div>
        <h1>💸 ¿En qué se me fue?</h1>
        <p class="subtitle">Control rápido de gastos hormiga y fugas</p>
      </div>
      <div class="actions">
        <button class="btn-ghost" onclick="exportCSV()">📥 CSV</button>
        <button class="btn-ghost" onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </header>

    <div class="grid-stats">
      <div class="card" style="margin:0">
        <div class="stat-label">Total gastado</div>
        <div class="stat-val" id="statTotal">$0</div>
      </div>
      <div class="card" style="margin:0">
        <div class="stat-label">Mayor fuga</div>
        <div class="stat-val" id="statTop" style="font-size:1rem;">—</div>
      </div>
      <div class="card" style="margin:0">
        <div class="stat-label">Promedio diario</div>
        <div class="stat-val" id="statAvg">$0</div>
      </div>
      <div class="card" style="margin:0">
        <div class="stat-label">Movimientos</div>
        <div class="stat-val" id="statCount">0</div>
      </div>
    </div>

    <div class="card">
      <div class="chips">
        <button class="chip" onclick="quickFill('Café', 45, 'Comida')">☕ Café $45</button>
        <button class="chip" onclick="quickFill('Comida corrida', 95, 'Comida')">🍱 Comida $95</button>
        <button class="chip" onclick="quickFill('Pasaje / Metro', 15, 'Transporte')">🚌 Pasaje $15</button>
        <button class="chip" onclick="quickFill('Recarga / Datos', 100, 'Servicios')">📱 Recarga $100</button>
        <button class="chip" onclick="quickFill('Antojo / Tienda', 35, 'Antojos')">🍫 Antojo $35</button>
      </div>

      <div class="form-row">
        <input type="number" id="amount" placeholder="Monto ($)" step="0.01" inputmode="decimal" />
        <input type="text" id="concept" placeholder="¿En qué lo gastaste?" />
      </div>

      <div class="cat-grid" id="catGrid"></div>

      <button class="btn-primary" onclick="addExpense()">+ Registrar gasto</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px; font-size:1rem;">Distribución por categoría</h3>
      <div class="chart-wrap">
        <canvas id="donutChart" width="180" height="180"></canvas>
        <div class="legend" id="chartLegend"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0; font-size:1rem;">Historial reciente</h3>
        <button class="btn-ghost" style="font-size:0.75rem;" onclick="clearAll()">Limpiar todo</button>
      </div>
      <div id="expenseList"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      { name: 'Comida', icon: '🍔', color: '#f97316' },
      { name: 'Transporte', icon: '🚌', color: '#3b82f6' },
      { name: 'Antojos', icon: '🍿', color: '#ec4899' },
      { name: 'Ocio', icon: '🎮', color: '#8b5cf6' },
      { name: 'Servicios', icon: '💡', color: '#14b8a6' },
      { name: 'Compras', icon: '🛍️', color: '#eab308' },
      { name: 'Salud', icon: '💊', color: '#ef4444' },
      { name: 'Otros', icon: '📦', color: '#64748b' }
    ];

    let selectedCat = 'Comida';
    let expenses = JSON.parse(localStorage.getItem('gastos_pwa_data') || '[]');

    function renderCategories() {
      const grid = document.getElementById('catGrid');
      grid.innerHTML = CATEGORIES.map(c => `
        <button type="button" class="cat-btn ${c.name === selectedCat ? 'active' : ''}" onclick="selectCat('${c.name}')">
          <span style="font-size:1.2rem">${c.icon}</span>
          <span>${c.name}</span>
        </button>
      `).join('');
    }

    function selectCat(name) {
      selectedCat = name;
      renderCategories();
    }

    function quickFill(concept, amount, cat) {
      document.getElementById('concept').value = concept;
      document.getElementById('amount').value = amount;
      selectCat(cat);
    }

    function addExpense() {
      const amount = parseFloat(document.getElementById('amount').value);
      const concept = document.getElementById('concept').value.trim() || selectedCat;
      if (!amount || amount <= 0) return alert('Ingresa un monto válido.');

      expenses.unshift({
        id: Date.now(),
        amount,
        concept,
        category: selectedCat,
        date: new Date().toISOString().split('T')[0]
      });

      saveAndRender();
      document.getElementById('amount').value = '';
      document.getElementById('concept').value = '';
    }

    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      saveAndRender();
    }

    function clearAll() {
      if (expenses.length && confirm('¿Borrar todos los registros?')) {
        expenses = [];
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('gastos_pwa_data', JSON.stringify(expenses));
      renderAll();
    }

    function renderAll() {
      const total = expenses.reduce((sum, e) => sum + e.amount, 0);
      document.getElementById('statTotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('statCount').textContent = expenses.length;

      const byCat = {};
      expenses.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);

      const sortedCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      if (sortedCats.length > 0) {
        const [topName, topVal] = sortedCats[0];
        const pct = Math.round((topVal / total) * 100);
        document.getElementById('statTop').textContent = `${topName} (${pct}%)`;
      } else {
        document.getElementById('statTop').textContent = '—';
      }

      const uniqueDays = new Set(expenses.map(e => e.date)).size || 1;
      document.getElementById('statAvg').textContent = `$${(total / uniqueDays).toFixed(0)}`;

      const list = document.getElementById('expenseList');
      if (!expenses.length) {
        list.innerHTML = `<p style="color:var(--muted); text-align:center; font-size:0.9rem;">Aún no hay gastos registrados.</p>`;
      } else {
        list.innerHTML = expenses.map(e => {
          const catObj = CATEGORIES.find(c => c.name === e.category) || CATEGORIES[7];
          return `
            <div class="expense-item">
              <div class="exp-info">
                <span class="exp-title">${catObj.icon} ${e.concept}</span>
                <span class="exp-meta">${e.category} • ${e.date}</span>
              </div>
              <div class="exp-right">
                <span class="exp-amount">$${e.amount.toFixed(2)}</span>
                <button class="btn-del" onclick="deleteExpense(${e.id})">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      drawDonut(sortedCats, total);
    }

    function drawDonut(sortedCats, total) {
      const canvas = document.getElementById('donutChart');
      const ctx = canvas.getContext('2d');
      const legend = document.getElementById('chartLegend');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!total) {
        ctx.beginPath();
        ctx.arc(90, 90, 65, 0, Math.PI * 2);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 22;
        ctx.stroke();
        legend.innerHTML = `<p style="color:var(--muted); font-size:0.85rem;">Registra un gasto para ver tu gráfica.</p>`;
        return;
      }

      let startAngle = -Math.PI / 2;
      legend.innerHTML = '';

      sortedCats.forEach(([catName, val]) => {
        const catObj = CATEGORIES.find(c => c.name === catName) || CATEGORIES[7];
        const sliceAngle = (val / total) * Math.PI * 2;

        ctx.beginPath();
        ctx.arc(90, 90, 65, startAngle, startAngle + sliceAngle);
        ctx.strokeStyle = catObj.color;
        ctx.lineWidth = 24;
        ctx.stroke();

        startAngle += sliceAngle;

        const pct = Math.round((val / total) * 100);
        legend.innerHTML += `
          <div class="legend-item">
            <span><span class="dot" style="background:${catObj.color}"></span>${catObj.icon} ${catName}</span>
            <strong>$${val.toFixed(0)} (${pct}%)</strong>
          </div>
        `;
      });
    }

    function exportCSV() {
      if (!expenses.length) return alert('No hay datos para exportar.');
      const rows = [['Fecha', 'Concepto', 'Categoria', 'Monto'], ...expenses.map(e => [e.date, `"${e.concept}"`, e.category, e.amount])];
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `gastos_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('gastos_theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    if (localStorage.getItem('gastos_theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '☀️';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').style.display = 'flex';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    });

    renderCategories();
    renderAll();
  </script>
</body>
</html>
